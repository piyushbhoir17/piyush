name: Build X00TD Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            libncurses-dev \
            libelf-dev \
            liblz4-tool \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            unzip \
            device-tree-compiler \
            cpio \
            python3

      - name: Clone Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git ~/clang

      - name: Fix Upstream DTC Variable Collision
        run: |
          # Resolve GCC 10+ global declaration bugs inline across lexer components
          find scripts/dtc/ -type f -name "dtc-lexer.l" -exec sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find scripts/dtc/ -type f -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Map toolchain binary path variables
          export PATH=~/clang/bin:$PATH
          
          mkdir -p out
          
          # Initialize device architecture defconfig configuration matrix
          make O=out asus/X00TD_defconfig

          # Compile using complete LLVM ecosystem parameter flags
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon"
            
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X00TD-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
